<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面不存在 · {{ site.Title }}</title>
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="stylesheet" id="chroma-light" href="{{ "css/chroma-light.css" | relURL }}?v={{ site.Params.cssVersion }}" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" id="chroma-dark" href="{{ "css/chroma-dark.css" | relURL }}?v={{ site.Params.cssVersion }}" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}?v={{ site.Params.cssVersion }}">
  {{ partial "theme-init.html" . }}
</head>
<body>
{{ partial "search-data.html" . }}
{{ partial "toolbar.html" . }}
<div class="site">
  {{ partial "header.html" . }}
  <main class="center-page">
    <div class="code">404</div>
    <h1>这里还没有内容</h1>
    <p>链接可能写错了，或者这篇文章已经搬了家。</p>
    <a class="btn" href="{{ "/" | relURL }}">回到首页</a>
  </main>
  {{ partial "footer.html" . }}
</div>
<script src="{{ "js/theme.js" | relURL }}?v={{ site.Params.cssVersion }}" defer></script>
</body>
</html>
