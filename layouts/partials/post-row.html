{{ $p := . }}
<li class="post">
  <div class="post-main">
    {{ if $p.Date.IsZero }}<time>未标注日期</time>{{ else }}<time datetime="{{ $p.Date.Format "2006-01-02" }}">{{ $p.Date.Format "2006-01-02" }}</time>{{ end }}
    <a class="post-title" href="{{ $p.RelPermalink }}">{{ $p.Title }}</a>
    <p class="post-dek">{{ $p.Description | default ($p.Summary | plainify | truncate 88) }}</p>
    <span class="post-meta">{{ with $p.Params.categories }}{{ delimit . " · " }}{{ else }}笔记{{ end }} · 约 {{ $p.ReadingTime }} 分钟</span>
  </div>
</li>
