{{ $p := . }}
<article class="card">
  {{ with $p.Params.cover }}
  <a class="card-cover" href="{{ $p.RelPermalink }}" aria-label="{{ $p.Title }}">
    <img src="{{ . | relURL }}" alt="{{ $p.Title }} 封面" loading="lazy">
  </a>
  {{ end }}
  <div class="card-body">
    <div class="card-meta">
      <time datetime="{{ $p.Date.Format "2006-01-02" }}">{{ $p.Date.Format "2006-01-02" }}</time>
      <span>· 约 {{ $p.ReadingTime }} 分钟</span>
    </div>
    <h3><a href="{{ $p.RelPermalink }}">{{ $p.Title }}</a></h3>
    <p>{{ $p.Description | default ($p.Summary | plainify | truncate 88) }}</p>
    <div class="card-tags">
      {{ range first 3 $p.Params.tags }}
      <a class="tag" href="{{ (printf "/tags/%s/" (urlize .)) | relURL }}">#{{ . }}</a>
      {{ end }}
    </div>
  </div>
</article>
