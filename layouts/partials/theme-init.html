<script>
(function () {
  var v = null;
  try {
    var m = document.cookie.match(/(?:^|;\s*)blog-theme=([^;]*)/);
    if (m) v = decodeURIComponent(m[1]);
    if (v !== 'light' && v !== 'dark') v = localStorage.getItem('blog-theme');
  } catch (e) {}
  if (v !== 'light' && v !== 'dark') return;
  document.documentElement.dataset.theme = v;
  var cl = document.getElementById('chroma-light');
  var cd = document.getElementById('chroma-dark');
  if (cl) cl.media = v === 'light' ? 'all' : 'not all';
  if (cd) cd.media = v === 'dark' ? 'all' : 'not all';
})();
</script>
