<div class="toolbar" role="toolbar" aria-label="站点工具栏">
  <div class="toolbar-search">
    <button type="button" id="search-toggle" class="tool-btn" aria-expanded="false" aria-controls="search-panel">搜索</button>
    <div class="search-panel" id="search-panel" hidden>
      <input type="search" id="site-search" class="search-input" placeholder="搜索标题、摘要或标签" aria-label="搜索文章" autocomplete="off">
      <ul class="search-results" id="search-results"></ul>
      <p class="search-hint" id="search-hint">Ctrl / Cmd + K 打开 · Esc 关闭</p>
    </div>
  </div>
  <button type="button" id="theme-toggle" class="tool-btn">深色</button>
</div>
