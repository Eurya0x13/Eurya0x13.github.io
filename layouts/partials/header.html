<header class="masthead">
  <a class="wordmark" href="{{ "/" | relURL }}">{{ site.Title }}</a>
  <p class="masthead-note">{{ site.Params.description }}</p>
  <nav class="nav" aria-label="主导航">
    {{ range site.Menus.main }}
    <a href="{{ .URL | relURL }}">{{ .Name }}</a>
    {{ end }}
  </nav>
  <button type="button" class="theme-toggle" id="theme-toggle">切换暗色</button>
</header>
